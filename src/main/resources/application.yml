server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_stock
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    org.springframework: INFO
